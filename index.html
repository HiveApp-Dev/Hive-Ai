<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS/Android Theme Colors -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hive AI">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Hive AI - Sports Odds Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-glass: rgba(20, 20, 20, 0.95);
            --bg-glass-hover: rgba(30, 30, 30, 0.98);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --accent-red: #ef4444;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            background: var(--bg-primary);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        /* iOS Safe Areas */
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            .input-area {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.05;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--success);
            bottom: -50px;
            left: -50px;
        }

        /* Header */
        .header {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--glass-border-light);
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .header-avatar:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .header-info h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .header-info span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            scroll-behavior: smooth;
            position: relative;
            z-index: 5;
            -webkit-overflow-scrolling: touch;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }

        .messages-wrapper {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Message Styles */
        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--glass-border-light);
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(16, 185, 129, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 14px;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(16, 185, 129, 0.3));
        }

        .message-bubble {
            flex: 1;
            max-width: 100%;
        }

        .message.user .message-bubble {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            border-top-left-radius: 4px;
            padding: 14px 18px;
        }

        .message.bot .message-bubble {
            padding: 4px 0;
        }

        .message-content {
            line-height: 1.7;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: right;
        }

        /* Ranking Tables */
        .ranking-table {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin: 14px 0;
            overflow: hidden;
        }

        .ranking-header {
            display: grid;
            grid-template-columns: 40px 1fr 80px 80px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 40px 1fr 80px 80px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-row:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .rank-number {
            font-weight: 700;
            font-size: 16px;
            color: var(--accent);
            display: flex;
            align-items: center;
        }

        .rank-team {
            display: flex;
            flex-direction: column;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .team-matchup {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .win-percentage {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
        }

        .best-bet {
            text-align: center;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Win Probability Bars */
        .probability-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 8px 0;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .high-probability { background: linear-gradient(90deg, var(--success), #34d399); }
        .medium-probability { background: linear-gradient(90deg, var(--warning), #fbbf24); }
        .low-probability { background: linear-gradient(90deg, var(--accent-red), #f87171); }

        /* Odds Card - Glass Style */
        .odds-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px;
            margin: 14px 0;
            transition: all 0.3s ease;
        }

        .odds-card:hover {
            background: var(--bg-glass-hover);
            border-color: var(--glass-border-light);
        }

        .odds-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--glass-border);
        }

        .odds-sport {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .odds-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .odds-matchup {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .odds-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .odds-item:hover {
            background: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .odds-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .odds-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .odds-team {
            font-size: 11px;
            color: var(--text-primary);
            margin-top: 4px;
            opacity: 0.8;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 20px 24px;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--glass-border);
        }

        .input-wrapper {
            max-width: 850px;
            margin: 0 auto;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 18px;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
        }

        .input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            padding: 0;
            min-height: 24px;
        }

        .input-container textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            font-size: 14px;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .send-btn:disabled {
            background: var(--glass-border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error State */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: var(--error);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Success Message */
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: var(--success);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Info Message */
        .info-message {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: var(--info);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }

        .empty-state img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .empty-state img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px var(--accent-glow);
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
            .header-avatar { width: 36px; height: 36px; }
            .header-status { display: none; }
            .messages-wrapper { padding: 0 16px; }
            .input-area { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
            .message { gap: 10px; }
            .message-avatar { width: 32px; height: 32px; border-radius: 50%; }
            .odds-grid { grid-template-columns: repeat(2, 1fr); }
            .input-container { padding: 10px 14px; }
            .send-btn { width: 36px; height: 36px; }
            .ranking-header, .ranking-row {
                grid-template-columns: 30px 1fr 70px 70px;
                padding: 10px 14px;
                font-size: 10px;
            }
        }

        /* Mobile-specific fixes */
        @media (max-width: 480px) {
            .input-container textarea {
                font-size: 16px;
            }
        }

        /* Prevent zoom on focus for mobile */
        @media (hover: none) and (pointer: coarse) {
            .input-container textarea {
                font-size: 16px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
    </div>

    <header class="header">
        <div class="header-left">
            <a href="https://t.me/Moneylinebott" target="_blank" rel="noopener noreferrer">
                <img src="https://pfst.cf2.poecdn.net/base/image/5c23342b1b649614b7519f7acbcab5f36510998541d798918faca857e7d0eabc?w=814&h=768" alt="Bot" class="header-avatar">
            </a>
            <div class="header-info">
                <h1>Hive AI</h1>
                <span id="botIntelligence">Learning your style...</span>
            </div>
        </div>
        <div class="header-status">
            <span class="status-dot"></span>
            Smart Odds
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="messages-wrapper" id="messagesWrapper">
            <div class="empty-state" id="emptyState">
                <a href="https://t.me/Moneylinebott" target="_blank" rel="noopener noreferrer">
                    <img src="https://pfst.cf2.poecdn.net/base/image/5c23342b1b649614b7519f7acbcab5f36510998541d798918faca857e7d0eabc?w=814&h=768" alt="Bot">
                </a>
                <p>Ask me about sports odds, rankings, and predictions</p>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-container">
                <textarea
                    id="messageInput"
                    placeholder="Ask: 'Rank tomorrow's NBA games by win %' or 'Show NFL predictions'"
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== ENHANCED CORE SYSTEM ====================
        
        // Multiple API Keys with Fallback (silent switching)
        const API_KEYS = {
            primary: '47c05ed65257b06a22df0ef01fc72e66',
            backup: '6bac22532f0b5a35e27fbce8bef399d0'
        };

        const API_BASE = 'https://api.the-odds-api.com/v4';
        const BOT_IMAGE = 'https://pfst.cf2.poecdn.net/base/image/5c23342b1b649614b7519f7acbcab5f36510998541d798918faca857e7d0eabc?w=814&h=768';
        
        // ONLY ONE STORAGE KEY FOR INTELLIGENCE - NO CHAT HISTORY
        const STORAGE_KEY = 'hive_ai_intelligence';

        // Enhanced Sports Mapping
        const SPORTS_MAP = {
            'nba': 'basketball_nba',
            'basketball': 'basketball_nba',
            'nba basketball': 'basketball_nba',
            'nba games': 'basketball_nba',
            'basketball games': 'basketball_nba',
            
            'nfl': 'americanfootball_nfl',
            'football': 'americanfootball_nfl',
            'nfl football': 'americanfootball_nfl',
            'nfl games': 'americanfootball_nfl',
            'football games': 'americanfootball_nfl',
            
            'mlb': 'baseball_mlb',
            'baseball': 'baseball_mlb',
            'mlb baseball': 'baseball_mlb',
            'mlb games': 'baseball_mlb',
            'baseball games': 'baseball_mlb',
            
            'nhl': 'icehockey_nhl',
            'hockey': 'icehockey_nhl',
            'nhl hockey': 'icehockey_nhl',
            
            'ufc': 'mma_mixed_martial_arts',
            'mma': 'mma_mixed_martial_arts',
            'fighting': 'mma_mixed_martial_arts',
            
            'soccer': 'soccer_usa_mls',
            'mls': 'soccer_usa_mls',
            'premier league': 'soccer_epl',
            'epl': 'soccer_epl',
            
            'ncaaf': 'americanfootball_ncaaf',
            'college football': 'americanfootball_ncaaf',
            'ncaab': 'basketball_ncaab',
            'college basketball': 'basketball_ncaab'
        };

        const SPORT_ICONS = {
            'americanfootball_nfl': 'football',
            'americanfootball_ncaaf': 'football',
            'basketball_nba': 'basketball',
            'basketball_ncaab': 'basketball',
            'baseball_mlb': 'baseball',
            'icehockey_nhl': 'hockey-puck',
            'soccer_usa_mls': 'futbol',
            'soccer_epl': 'futbol',
            'mma_mixed_martial_arts': 'hand-fist'
        };

        // Query Patterns for understanding complex requests
        const QUERY_PATTERNS = {
            RANK_BY_WIN_PERCENT: /(rank|sort|order|list|show).*(by|according to|based on).*(win|probability|chance|%)/i,
            RANK_BY_ODDS: /(rank|sort|order|list).*(by|according to|based on).*(odds|line|spread|moneyline)/i,
            TOP_GAMES: /(top|best|highest|most likely).*(games|matches|odds)/i,
            TOMORROW_GAMES: /(tomorrow|tomorrow's|next day).*(games|matches|odds)/i,
            TODAY_GAMES: /(today|today's|tonight|tonight's).*(games|matches|odds)/i,
            WIN_PREDICTIONS: /(predict|prediction|forecast|who will win).*/i,
            VALUE_BETS: /(value|best bet|smart bet|good odds).*/i,
            COMPARE_TEAMS: /(compare|versus|vs|matchup|head to head).*/i,

        function learnFromUserMessage(message) {
            // Update interaction counts
            aiIntelligence.userProfile.interactionCount++;
            currentSession.queryCount++;
            
            const lowerMsg = message.toLowerCase();
            const hour = new Date().getHours();
            const timeOfDay = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
            
            // Learn sports preferences
            for (const [keyword, sportKey] of Object.entries(SPORTS_MAP)) {
                if (lowerMsg.includes(keyword)) {
                    aiIntelligence.sportsPreferences.sportFrequency[sportKey] = 
                        (aiIntelligence.sportsPreferences.sportFrequency[sportKey] || 0) + 1;
                    
                    // Update most asked sport
                    const currentMax = aiIntelligence.sportsPreferences.mostAskedSport;
                    const currentCount = currentMax ? aiIntelligence.sportsPreferences.sportFrequency[currentMax] || 0 : 0;
                    
                    if (aiIntelligence.sportsPreferences.sportFrequency[sportKey] > currentCount) {
                        aiIntelligence.sportsPreferences.mostAskedSport = sportKey;
                    }
                }
            }
            
            // Learn query patterns
            const queryType = analyzeQueryType(message);
            queryType.forEach(type => {
                aiIntelligence.queryPatterns.commonQueryTypes[type] = 
                    (aiIntelligence.queryPatterns.commonQueryTypes[type] || 0) + 1;
            });
            
            // Learn time patterns
            aiIntelligence.sportsPreferences.timeOfDayPatterns[timeOfDay] = 
                (aiIntelligence.sportsPreferences.timeOfDayPatterns[timeOfDay] || 0) + 1;
            
            // Learn conversation style
            if (/(hi|hello|hey|good morning|good afternoon|good evening)/i.test(message)) {
                if (!aiIntelligence.conversationStyle.preferredGreetings.includes(message.toLowerCase())) {
                    aiIntelligence.conversationStyle.preferredGreetings.push(message.toLowerCase());
                }
            }
            
            // Detect formality
            if (message.length < 10 && /^(hi|hey|sup|yo)/i.test(message)) {
                aiIntelligence.conversationStyle.userFormality = 'casual';
            } else if (/(please|thank you|kindly|appreciate)/i.test(message)) {
                aiIntelligence.conversationStyle.userFormality = 'formal';
            }
            
            // Detect detail preference
            if (/(explain|detailed|break down|analyze)/i.test(message)) {
                aiIntelligence.conversationStyle.userDetailPreference = 'detailed';
            } else if (/(quick|brief|short)/i.test(message)) {
                aiIntelligence.conversationStyle.userDetailPreference = 'brief';
            }
            
            // Detect emoji usage
            if (/[😀-🙏🏀-🏈⚽-⚾🎯-🎰]/g.test(message)) {
                aiIntelligence.conversationStyle.usesEmojis = true;
            }
            
            // Update learning metrics
            aiIntelligence.learningMetrics.totalLearningScore = 
                Math.min(100, aiIntelligence.userProfile.interactionCount * 0.5);
            
            // Save intelligence
            saveIntelligence();
        }

        function learnFromBotResponse(response) {

                }

                    aiIntelligence.responseGeneration.contextualMemory.push('contextual_reference');

                saveIntelligence();
            }

        async function processMessageWithIntelligence(message) {
            const lowerMsg = message.toLowerCase();
            
            // Generate personalized greeting if it's a greeting

            // Generate personalized thanks response

            // Generate personalized help
            if (isHelp(lowerMsg)) {
                return generatePersonalizedHelp();
            }
            
            // Analyze query type
            const queryType = analyzeQueryType(message);
            
            // Detect sport
            let detectedSport = detectSportFromMessage(message);
            
            // If no sport but we have learned preferences, suggest
            if (!detectedSport && aiIntelligence.sportsPreferences.mostAskedSport) {
                detectedSport = aiIntelligence.sportsPreferences.mostAskedSport;
            }
            
            // Handle complex queries with intelligence
            if (queryType.includes('RANK') && detectedSport) {
                return await handleIntelligentRanking(message, detectedSport, queryType);
            }
            
            if (queryType.includes('PREDICTION') && detectedSport) {
                return await handleIntelligentPrediction(message, detectedSport);
            }
            
            if (queryType.includes('COMPARE') && detectedSport) {
                return await handleIntelligentComparison(message, detectedSport);
            }
            
            if (queryType.includes('VALUE') && detectedSport) {
                return await handleIntelligentValueBets(message, detectedSport);
            }
            
            // Standard odds query with personalization
            if (detectedSport) {
                try {
                    const odds = await fetchOdds(detectedSport);
                    if (odds.length === 0) {
                        return { 
                            text: generatePersonalizedNoGamesResponse(detectedSport), 
                            isHtml: false 
                        };
                    }
                    
                    // Add personalized intro based on learned preferences
                    const personalizedIntro = generatePersonalizedSportIntro(detectedSport);
                    const oddsHtml = formatOddsResponse(odds, detectedSport);
                    
                    return {
                        text: personalizedIntro + oddsHtml,
                        isHtml: true
                    };
                    
                } catch (error) {
                    throw new Error(generatePersonalizedErrorResponse());
                }
            }
            
            // Memory query with personalization
            if (/(what do you remember|my preferences|favorite)/i.test(lowerMsg)) {
                return generateIntelligentMemoryResponse();
            }
            
            // Fallback with learned context
            return generateIntelligentFallbackResponse();
        }

        // ==================== INTELLIGENT QUERY HANDLERS ====================

        async function handleIntelligentRanking(message, sport, queryType) {
            try {
                const odds = await fetchOdds(sport);
                if (odds.length === 0) {
                    return { 
                        text: generatePersonalizedNoGamesResponse(sport), 
                        isHtml: false 
                    };
                }
                
                const gamesWithProbabilities = calculateWinProbabilities(odds);
                
                // Sort based on query type
                let sortedGames;
                if (queryType.includes('WIN_PERCENT')) {
                    sortedGames = gamesWithProbabilities.sort((a, b) => b.winProbability - a.winProbability);
                } else {
                    sortedGames = gamesWithProbabilities.sort((a, b) => a.avgOdds - b.avgOdds);
                }
                
                // Limit based on learned preference
                const topMatch = message.match(/top (\d+)/i);
                let limit = topMatch ? parseInt(topMatch[1]) : 5;
                
                // Adjust based on user's detail preference
                if (aiIntelligence.conversationStyle.userDetailPreference === 'brief') {
                    limit = Math.min(limit, 3);
                } else if (aiIntelligence.conversationStyle.userDetailPreference === 'detailed') {
                    limit = Math.min(limit, 10);
                }
                
                const displayGames = sortedGames.slice(0, limit);
                
                // Add personalized context
                const personalContext = aiIntelligence.userProfile.interactionCount > 10 ? 
                    `<div class="info-message">
                        <i class="fas fa-lightbulb"></i> Ranked based on your preference for ${aiIntelligence.conversationStyle.userDetailPreference} analysis
                    </div>` : '';
                
                return { 
                    text: personalContext + generateRankingTable(displayGames, sport, queryType), 
                    isHtml: true 
                };
                
            } catch (error) {
                throw new Error(generatePersonalizedErrorResponse());
            }
        }

        async function handleIntelligentPrediction(message, sport) {
            try {
                const odds = await fetchOdds(sport);
                if (odds.length === 0) {
                    return { 
                        text: generatePersonalizedNoGamesResponse(sport), 
                        isHtml: false 
                    };
                }
                
                const predictions = calculateWinProbabilities(odds)
                    .map(game => {
                        const favorite = game.homeWinProbability > game.awayWinProbability ? 
                            `${game.homeTeam} (${Math.round(game.homeWinProbability)}%)` : 
                            `${game.awayTeam} (${Math.round(game.awayWinProbability)}%)`;
                        
                        return {
                            ...game,
                            prediction: favorite,
                            confidence: Math.max(game.homeWinProbability, game.awayWinProbability)
                        };
                    })
                    .sort((a, b) => b.confidence - a.confidence)
                    .slice(0, 5); // Show top 5 predictions
                
                return { 
                    text: generatePredictionsTable(predictions, sport), 
                    isHtml: true 
                };
                
            } catch (error) {
                throw new Error(generatePersonalizedErrorResponse());
            }
        }

        async function handleIntelligentComparison(message, sport) {
            // Similar to previous but with personalized touches
            const teamRegex = /(?:compare|versus|vs|matchup|head to head)\s+(.+?)\s+(?:and|vs|versus)\s+(.+)/i;
            const match = message.match(teamRegex);
            
            if (!match) {
                return { 
                    text: "Please specify teams to compare. Example: 'Compare Lakers vs Warriors'", 
                    isHtml: false 
                };
            }
            
            try {
                const odds = await fetchOdds(sport);
                const game = odds.find(g => 
                    g.home_team.toLowerCase().includes(match[1].toLowerCase()) || 
                    g.away_team.toLowerCase().includes(match[1].toLowerCase()) ||
                    g.home_team.toLowerCase().includes(match[2].toLowerCase()) || 
                    g.away_team.toLowerCase().includes(match[2].toLowerCase())
                );
                
                if (!game) {
                    return { 
                        text: `Couldn't find a matchup between ${match[1]} and ${match[2]}.`, 
                        isHtml: false 
                    };
                }
                
                return { 
                    text: generateComparisonTable(game, match[1], match[2]), 
                    isHtml: true 
                };
                
            } catch (error) {
                throw new Error(generatePersonalizedErrorResponse());
            }
        }

        async function handleIntelligentValueBets(message, sport) {
            try {
                const odds = await fetchOdds(sport);
                if (odds.length === 0) {
                    return { 
                        text: generatePersonalizedNoGamesResponse(sport), 
                        isHtml: false 
                    };
                }
                
                const valueBets = findValueBets(odds);
                
                // Add personalized note about value betting
                const personalNote = aiIntelligence.userProfile.interactionCount > 15 ? 
                    `<div class="info-message">
                        <i class="fas fa-gem"></i> Based on our history, you seem interested in value bets. Here are today's best opportunities:
                    </div>` : '';
                
                return { 
                    text: personalNote + generateValueBetsTable(valueBets.slice(0, 5), sport), 
                    isHtml: true 
                };
                
            } catch (error) {
                throw new Error(generatePersonalizedErrorResponse());
            }
        }

        // ==================== HELPER FUNCTIONS ====================

        function analyzeQueryType(message) {
            const types = [];
            
            for (const [pattern, regex] of Object.entries(QUERY_PATTERNS)) {
                if (regex.test(message)) {
                    types.push(pattern);
                }
            }
            
            return types.length > 0 ? types : ['STANDARD'];
        }

        function detectSportFromMessage(message) {
            const lowerMsg = message.toLowerCase();
            for (const [keyword, sportKey] of Object.entries(SPORTS_MAP)) {
                if (lowerMsg.includes(keyword)) {
                    return sportKey;
                }
            }
            return null;
        }

        function getAlternativeSportSuggestion(currentSport) {
            const sports = ['basketball_nba', 'americanfootball_nfl', 'baseball_mlb'];
            const currentIndex = sports.indexOf(currentSport);
            return currentIndex >= 0 && currentIndex < sports.length - 1 ? 
                getSportName(sports[currentIndex + 1]) : getSportName(sports[0]);
        }

        function isGreeting(message) {
            return /^(hi|hello|hey|howdy|good morning|good afternoon|good evening)/i.test(message);
        }

        function isThanks(message) {
            return /(thank|thanks|appreciate|thx)/i.test(message);
        }

        function isHelp(message) {
            return /(help|what can you do|how do i)/i.test(message);
        }

        function getSportName(sportKey) {
            const names = {
                'americanfootball_nfl': 'NFL',
                'basketball_nba': 'NBA',
                'baseball_mlb': 'MLB',
                'icehockey_nhl': 'NHL',
                'soccer_usa_mls': 'MLS',
                'soccer_epl': 'EPL',
                'mma_mixed_martial_arts': 'UFC',
                'americanfootball_ncaaf': 'NCAAF',
                'basketball_ncaab': 'NCAAB'
            };
            return names[sportKey] || sportKey;
        }

        // ==================== DATA PROCESSING FUNCTIONS ====================

        async function fetchOdds(sport) {
            // Try primary API silently
            try {
                const data = await fetchWithApi(API_KEYS.primary, sport);
                currentApi = 'primary';
                return data;
            } catch (error) {
                // Silently switch to backup
                console.log('Switching to backup API...');
                apiFallbackUsed = true;
                currentApi = 'backup';
                return await fetchWithApi(API_KEYS.backup, sport);
            }
        }

        async function fetchWithApi(apiKey, sport) {
            const url = `${API_BASE}/sports/${sport}/odds/?apiKey=${apiKey}&regions=us&markets=h2h,spreads&oddsFormat=american`;
            
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('API request failed');
            }
            
            const data = await response.json();
            return data.slice(0, 10);
        }

        function calculateWinProbabilities(games) {
            return games.map(game => {
                let homeWinProbability = 50;
                let awayWinProbability = 50;
                let avgOdds = 0;
                
                if (game.bookmakers?.[0]?.markets?.[0]?.outcomes) {
                    const outcomes = game.bookmakers[0].markets[0].outcomes;
                    
                    outcomes.forEach(outcome => {
                        const odds = outcome.price;
                        let probability;
                        
                        if (odds > 0) {
                            probability = 100 / (odds + 100);
                        } else {
                            probability = Math.abs(odds) / (Math.abs(odds) + 100);
                        }
                        
                        if (outcome.name === game.home_team) {
                            homeWinProbability = probability * 100;
                        } else {
                            awayWinProbability = probability * 100;
                        }
                        
                        avgOdds += Math.abs(odds);
                    });
                    
                    avgOdds /= outcomes.length;
                }
                
                const winProbability = Math.max(homeWinProbability, awayWinProbability);
                
                return {
                    ...game,
                    homeTeam: game.home_team,
                    awayTeam: game.away_team,
                    homeWinProbability,
                    awayWinProbability,
                    winProbability,
                    avgOdds,
                    favorite: homeWinProbability > awayWinProbability ? game.home_team : game.away_team,
                    bestBet: determineBestBet(homeWinProbability, awayWinProbability)
                };
            });
        }

        function determineBestBet(homeProb, awayProb) {
            const edge = Math.abs(homeProb - awayProb);
            
            if (edge > 15) return "Big Favorite";
            if (edge > 8) return "Moderate Favorite";
            if (edge < 3) return "Close Game";
            
            return "Watch";
        }

        function findValueBets(games) {
            return calculateWinProbabilities(games)
                .map(game => {
                    const valueScore = Math.abs(game.homeWinProbability - game.awayWinProbability) / 10;
                    return {
                        ...game,
                        valueScore,
                        isValueBet: valueScore > 1.2
                    };
                })
                .filter(game => game.isValueBet)
                .sort((a, b) => b.valueScore - a.valueScore);
        }

        // ==================== TABLE GENERATORS (No API messages) ====================

        function generateRankingTable(games, sport, queryType) {
            const sportName = getSportName(sport);
            const title = queryType.includes('WIN_PERCENT') ? 
                `Top ${games.length} ${sportName} Games by Win Probability` :
                `Top ${games.length} ${sportName} Games`;
            
            let html = `
                <div class="ranking-table">
                    <div class="ranking-header">
                        <div>Rank</div>
                        <div>Matchup</div>
                        <div>Win %</div>
                        <div>Best Bet</div>
                    </div>
            `;
            
            games.forEach((game, index) => {
                const probability = Math.max(game.homeWinProbability, game.awayWinProbability);
                const probabilityClass = probability >= 65 ? 'high-probability' : 
                                        probability >= 55 ? 'medium-probability' : 'low-probability';
                
                html += `
                    <div class="ranking-row">
                        <div class="rank-number">#${index + 1}</div>
                        <div class="rank-team">
                            <div class="team-name">${game.homeTeam}</div>
                            <div class="team-matchup">vs ${game.awayTeam}</div>
                            <div class="probability-bar">
                                <div class="probability-fill ${probabilityClass}" style="width: ${probability}%"></div>
                            </div>
                        </div>
                        <div class="win-percentage">${Math.round(probability)}%</div>
                        <div class="best-bet">${game.bestBet}</div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            return html;
        }

        function generatePredictionsTable(predictions, sport) {
            const sportName = getSportName(sport);
            
            let html = `
                <p><i class="fas fa-crystal-ball"></i> <strong>${sportName} Predictions</strong></p>
                <div class="ranking-table">
                    <div class="ranking-header">
                        <div>#</div>
                        <div>Prediction</div>
                        <div>Confidence</div>
                        <div>Edge</div>
                    </div>
            `;
            
            predictions.forEach((pred, index) => {
                const edge = Math.abs(pred.homeWinProbability - pred.awayWinProbability);
                const edgeText = edge >= 10 ? 'High' : edge >= 5 ? 'Medium' : 'Low';
                
                html += `
                    <div class="ranking-row">
                        <div class="rank-number">${index + 1}</div>
                        <div class="rank-team">
                            <div class="team-name">${pred.prediction}</div>
                            <div class="team-matchup">${pred.homeTeam} vs ${pred.awayTeam}</div>
                        </div>
                        <div class="win-percentage">${Math.round(pred.confidence)}%</div>
                        <div class="best-bet">${edgeText}</div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            return html;
        }

        function generateComparisonTable(game, team1, team2) {
            const probabilities = calculateWinProbabilities([game])[0];
            const homeIsTeam1 = game.home_team.toLowerCase().includes(team1.toLowerCase());
            const team1Prob = homeIsTeam1 ? probabilities.homeWinProbability : probabilities.awayWinProbability;
            const team2Prob = homeIsTeam1 ? probabilities.awayWinProbability : probabilities.homeWinProbability;
            
            return `
                <div class="odds-card">
                    <div class="odds-header">
                        <div class="odds-sport"><i class="fas fa-balance-scale"></i> Matchup Analysis</div>
                        <div class="odds-time">Head-to-Head</div>
                    </div>
                    <div class="odds-matchup" style="text-align: center; font-size: 16px;">
                        ${team1} vs ${team2}
                    </div>
                    <div class="odds-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="odds-item">
                            <div class="odds-label">${team1} Win %</div>
                            <div class="odds-value">${Math.round(team1Prob)}%</div>
                            <div class="probability-bar">
                                <div class="probability-fill ${team1Prob >= 50 ? 'high-probability' : 'low-probability'}" 
                                     style="width: ${team1Prob}%"></div>
                            </div>
                        </div>
                        <div class="odds-item">
                            <div class="odds-label">${team2} Win %</div>
                            <div class="odds-value">${Math.round(team2Prob)}%</div>
                            <div class="probability-bar">
                                <div class="probability-fill ${team2Prob >= 50 ? 'high-probability' : 'low-probability'}" 
                                     style="width: ${team2Prob}%"></div>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 16px; text-align: center; color: var(--accent); font-size: 12px;">
                        <i class="fas fa-lightbulb"></i> ${team1Prob > team2Prob ? team1 : team2} is favored by ${Math.abs(Math.round(team1Prob - team2Prob))}%
                    </div>
                </div>
            `;
        }

        function generateValueBetsTable(valueBets, sport) {
            const sportName = getSportName(sport);
            
            if (valueBets.length === 0) {
                return `<div class="info-message">
                    <i class="fas fa-search"></i> No strong value bets found in ${sportName} right now.
                </div>`;
            }
            
            let html = `
                <p><i class="fas fa-gem"></i> <strong>${sportName} Value Bets</strong></p>
                <div class="ranking-table">
                    <div class="ranking-header">
                        <div>#</div>
                        <div>Game</div>
                        <div>Value</div>
                        <div>Play</div>
                    </div>
            `;
            
            valueBets.forEach((bet, index) => {
                const valueScore = bet.valueScore.toFixed(1);
                
                html += `
                    <div class="ranking-row">
                        <div class="rank-number">${index + 1}</div>
                        <div class="rank-team">
                            <div class="team-name">${bet.homeTeam} vs ${bet.awayTeam}</div>
                            <div class="team-matchup">Fav: ${bet.favorite} (${Math.round(bet.winProbability)}%)</div>
                        </div>
                        <div class="win-percentage">${valueScore}x</div>
                        <div class="best-bet" style="background: rgba(16, 185, 129, 0.2); color: var(--success);">
                            <i class="fas fa-check-circle"></i> Value
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            return html;
        }

        function formatOddsResponse(games, sport) {
            const sportName = getSportName(sport);
            const icon = SPORT_ICONS[sport] || 'trophy';

            let html = `<p><i class="fas fa-${icon}"></i> <strong>${sportName} Odds</strong></p>`;

            games.forEach(game => {
                const gameTime = new Date(game.commence_time);
                const timeStr = gameTime.toLocaleString('en-US', {
                    weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                });

                html += `<div class="odds-card">
                    <div class="odds-header">
                        <div class="odds-sport"><i class="fas fa-${icon}"></i> ${sportName}</div>
                        <div class="odds-time">${timeStr}</div>
                    </div>
                    <div class="odds-matchup">${game.away_team} @ ${game.home_team}</div>
                    <div class="odds-grid">`;

                if (game.bookmakers?.length > 0) {
                    const bookmaker = game.bookmakers[0];
                    const h2hMarket = bookmaker.markets.find(m => m.key === 'h2h');
                    if (h2hMarket) {
                        h2hMarket.outcomes.forEach(outcome => {
                            const odds = outcome.price > 0 ? `+${outcome.price}` : outcome.price;
                            html += `<div class="odds-item">
                                <div class="odds-label">ML</div>
                                <div class="odds-value">${odds}</div>
                                <div class="odds-team">${outcome.name}</div>
                            </div>`;
                        });
                    }
                    const spreadsMarket = bookmaker.markets.find(m => m.key === 'spreads');
                    if (spreadsMarket) {
                        spreadsMarket.outcomes.forEach(outcome => {
                            const spread = outcome.point > 0 ? `+${outcome.point}` : outcome.point;
                            html += `<div class="odds-item">
                                <div class="odds-label">Spread</div>
                                <div class="odds-value">${spread}</div>
                                <div class="odds-team">${outcome.name}</div>
                            </div>`;
                        });
                    }
                }
                html += `</div></div>`;
            });

            return html;
        }

        // ==================== INITIALIZE ====================

        document.addEventListener('DOMContentLoaded', initialize);
        
        // Prevent zoom on input focus
        document.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
                // Prevent default zoom behavior
            }
        }, { passive: true });
    </script>
